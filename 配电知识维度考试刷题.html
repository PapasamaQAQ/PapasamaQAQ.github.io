<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配电班-初级-新员工 - 题研</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#1f2937}
.app{max-width:900px;margin:0 auto;padding:22px 16px 60px}
h1{margin:0 0 5px;font-size:28px}.sub{color:#6b7280;margin-bottom:18px}
.panel,.question-card,.empty-mode,.exam-summary{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.panel{padding:17px;margin-bottom:16px}.info{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.info-title{font-weight:700}.info-meta{color:#6b7280;font-size:14px}
.search-panel{padding:17px;margin-bottom:16px}
.search-title{font-weight:700;margin-bottom:10px}
.search-row{display:flex;gap:9px}
.search-input{flex:1;min-width:0;padding:12px 14px;border:1px solid #d1d5db;border-radius:11px;font-size:16px;outline:none}
.search-input:focus{border-color:#64748b;box-shadow:0 0 0 3px rgba(100,116,139,.10)}
.search-clear{white-space:nowrap;background:#e5e7eb;color:#111827}
.search-info{margin-top:10px;color:#6b7280;font-size:13px}
.search-results{display:none;margin-top:12px;border-top:1px solid #eef2f7;padding-top:10px;max-height:420px;overflow:auto}
.search-item{width:100%;text-align:left;border:1px solid #e5e7eb;background:#fff;border-radius:11px;padding:12px 13px;margin-bottom:8px;cursor:pointer}
.search-item:hover{background:#f8fafc;border-color:#94a3b8}
.search-item-head{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:5px;font-size:13px;color:#64748b}
.search-item-title{line-height:1.55;color:#1f2937}
.search-empty{padding:14px 4px;color:#9ca3af;text-align:center}
.search-view-actions{display:none}
.search-answer{display:none;margin-top:16px;padding:16px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;line-height:1.75;color:#7c2d12}
.search-answer.show{display:block}
.search-answer-title{font-size:17px;font-weight:800;margin-bottom:8px}
.search-analysis{margin-top:12px;padding-top:12px;border-top:1px solid #fed7aa;color:#374151;white-space:pre-wrap}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.mode-btn{border:1px solid #dbe2ea;background:#f8fafc;color:#1f2937;border-radius:12px;padding:13px 8px;cursor:pointer;font-size:14px}
.mode-btn.active{background:#1f2937;color:#fff;border-color:#1f2937}.mode-count{display:block;margin-top:4px;font-size:12px;opacity:.75}
.type-filter-panel{display:none}
.type-filter-title{font-weight:700;margin-bottom:10px}
.type-filter-tip{color:#6b7280;font-size:13px;margin-bottom:12px}
.type-filters{display:flex;flex-wrap:wrap;gap:8px}
.type-filter-btn{border:1px solid #dbe2ea;background:#fff;color:#374151;border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer}
.type-filter-btn.active{background:#1f2937;color:#fff;border-color:#1f2937}
.review-mode-panel{display:none}
.review-mode-title{font-weight:700;margin-bottom:10px}
.review-mode-tip{color:#6b7280;font-size:13px;margin-bottom:12px}
.review-mode-buttons{display:flex;flex-wrap:wrap;gap:8px}
.review-mode-btn{border:1px solid #dbe2ea;background:#fff;color:#374151;border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer}
.review-mode-btn.active{background:#0f766e;color:#fff;border-color:#0f766e}
.order-mode-panel{display:none}
.order-mode-title{font-weight:700;margin-bottom:10px}
.order-mode-tip{color:#6b7280;font-size:13px;margin-bottom:12px}
.order-mode-buttons{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.order-mode-btn{border:1px solid #dbe2ea;background:#fff;color:#374151;border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer}
.order-mode-btn.active{background:#7c3aed;color:#fff;border-color:#7c3aed}
.reshuffle-btn{border:1px dashed #a78bfa;background:#faf5ff;color:#6d28d9;border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer}
.question-card{display:none;padding:21px}.q-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px;color:#6b7280;font-size:14px}
.tag{display:inline-block;margin-left:5px;padding:2px 8px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:12px}
.score-tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#fef3c7;color:#92400e;font-size:12px;margin-left:6px}
.head-right{display:flex;align-items:center;gap:9px}.category{color:#64748b}
.star{width:38px;height:38px;border:0;border-radius:50%;background:#f1f5f9;cursor:pointer;font-size:23px;line-height:1;padding:0;color:#94a3b8}
.star.on{color:#f59e0b;background:#fffbeb}.q-title{font-size:19px;font-weight:700;line-height:1.7;margin-bottom:17px;white-space:pre-wrap}
.options{display:grid;gap:9px}.option{display:flex;gap:10px;align-items:flex-start;width:100%;padding:13px 14px;border:1px solid #e5e7eb;border-radius:12px;background:#f8fafc;cursor:pointer;line-height:1.55;user-select:none}
.option:hover{border-color:#94a3b8;background:#f1f5f9}.option input{margin-top:4px;transform:scale(1.12);flex:0 0 auto}
.option.selected{border-color:#64748b;background:#eef2f7}.option.correct{border-color:#22c55e;background:#f0fdf4}.option.wrong{border-color:#ef4444;background:#fef2f2}.option.disabled{cursor:default}
.blank-area{display:grid;gap:11px}.blank-row{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:10px}.blank-label{color:#64748b;font-size:14px}
.blank-input{width:100%;padding:12px 13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;outline:none;background:#fff}
.blank-input.correct{border-color:#22c55e;background:#f0fdf4}.blank-input.wrong{border-color:#ef4444;background:#fef2f2}
.actions{display:flex;justify-content:center;gap:10px;margin-top:19px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:11px 18px;font-size:15px;cursor:pointer}.primary{background:#1f2937;color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#b91c1c;color:#fff}.danger-light{background:#fee2e2;color:#991b1b}
button:disabled{opacity:.45;cursor:not-allowed}
.result{display:none;margin-top:19px;padding:15px 16px;border-radius:12px;line-height:1.7}.result.ok{display:block;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}.result.bad{display:block;background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.analysis-box{margin-top:11px;padding-top:11px;border-top:1px solid rgba(100,116,139,.25);color:#374151;white-space:pre-wrap}.empty{color:#9ca3af}.wrong-note{margin-top:7px;font-weight:600}
.progress{margin-top:14px;color:#6b7280;font-size:13px;text-align:center}.empty-mode{display:none;padding:26px 16px;text-align:center;color:#6b7280}
.overview-bar{display:none;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:9px 11px;border-radius:10px;background:#f8fafc;color:#64748b;font-size:13px}
.overview-btn{padding:7px 11px;border-radius:9px;background:#e2e8f0;color:#334155;font-size:13px;white-space:nowrap}
.overview-modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(15,23,42,.48);padding:18px;align-items:flex-end;justify-content:center}
.overview-modal.show{display:flex}
.overview-sheet{width:min(720px,100%);max-height:82vh;overflow:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.overview-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}
.overview-head h3{margin:0;font-size:19px}
.overview-close{padding:7px 10px;background:#e5e7eb;color:#334155}
.overview-summary{font-size:13px;color:#64748b;margin-bottom:10px}
.overview-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:#64748b;margin-bottom:12px}
.legend-dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid #cbd5e1}
.legend-unanswered{background:#f8fafc}.legend-ok{background:#dcfce7;border-color:#86efac}.legend-bad{background:#fee2e2;border-color:#fca5a5}.legend-current{background:#dbeafe;border:2px solid #2563eb}
.qnum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px}
.qnum-btn{min-width:0;padding:9px 4px;border:1px solid #cbd5e1;border-radius:9px;background:#f8fafc;color:#334155;font-size:13px}
.qnum-btn.done-ok{background:#dcfce7;border-color:#86efac;color:#166534}
.qnum-btn.done-bad{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.qnum-btn.done-visited{background:#ede9fe;border-color:#c4b5fd;color:#5b21b6}
.qnum-btn.done-answered{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}
.qnum-btn.exam-unanswered{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.qnum-btn.current{outline:2px solid #2563eb;outline-offset:1px}
.overview-footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #e5e7eb}
.reset-progress-btn{background:#fff;color:#991b1b;border:1px solid #fecaca;padding:8px 11px}
.memo-answer{margin-top:16px;padding:16px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;line-height:1.75;color:#7c2d12}
.memo-answer-title{font-size:17px;font-weight:800;margin-bottom:8px}.memo-analysis{margin-top:12px;padding-top:12px;border-top:1px solid #fed7aa;color:#374151;white-space:pre-wrap}.memo-tip{margin-top:10px;color:#9a3412;font-size:13px}
.exam-setup{display:none}.exam-setup h2{margin:0 0 6px;font-size:21px}.exam-tip{color:#6b7280;margin-bottom:14px;line-height:1.6}
.exam-grid{display:grid;grid-template-columns:1.1fr .7fr 1fr 1fr;gap:8px;align-items:center}.exam-grid .head{font-size:13px;color:#64748b;font-weight:700;padding-bottom:5px}.exam-grid .type-name{font-weight:650}
.exam-grid input{width:100%;padding:9px 10px;border:1px solid #d1d5db;border-radius:9px;font-size:15px}.exam-total{margin-top:15px;padding:12px 14px;border-radius:10px;background:#f8fafc;line-height:1.7}
.exam-summary{display:none;padding:22px;margin-bottom:16px}.exam-summary h2{margin:0 0 8px}.big-score{font-size:34px;font-weight:800;margin:8px 0 16px}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.summary-item{padding:12px;background:#f8fafc;border-radius:12px;text-align:center;line-height:1.55}
.summary-item strong{display:block;font-size:18px;margin-bottom:2px}.exam-note{margin-top:12px;color:#6b7280;line-height:1.6;font-size:14px}
@media(max-width:820px){.modes{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.summary-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
  body{font-size:14px}
  .app{padding:10px 8px 80px}
  h1{font-size:20px;line-height:1.25;margin-bottom:2px}
  .sub{font-size:12px;margin-bottom:8px}
  .panel{padding:10px;margin-bottom:8px;border-radius:12px}
  .info{gap:5px}.info-title{font-size:13px}.info-meta{font-size:11px}
  .search-panel{padding:10px}.search-title{font-size:14px;margin-bottom:7px}
  .search-row{flex-direction:column;gap:6px}.search-input{padding:9px 10px;font-size:14px}.search-clear{width:100%;padding:8px}
  .search-info{font-size:11px;margin-top:6px}
  .modes{grid-template-columns:repeat(2,1fr);gap:6px}.mode-btn{padding:9px 5px;font-size:12px;border-radius:10px}.mode-count{font-size:10px;margin-top:2px}
  .type-filter-title{font-size:13px;margin-bottom:6px}.type-filter-tip{font-size:11px;margin-bottom:7px}.type-filters{gap:5px}.type-filter-btn{padding:7px 10px;font-size:12px}.review-mode-title,.order-mode-title{font-size:13px;margin-bottom:6px}.review-mode-tip,.order-mode-tip{font-size:11px;margin-bottom:7px}.review-mode-buttons,.order-mode-buttons{gap:5px}.review-mode-btn,.order-mode-btn,.reshuffle-btn{padding:7px 10px;font-size:12px}
  .question-card{padding:11px 9px 76px;border-radius:12px}
  .q-head{gap:6px;margin-bottom:7px;font-size:11px}.tag{font-size:10px;padding:1px 6px}.score-tag{font-size:10px;padding:1px 6px}
  .star{width:31px;height:31px;font-size:19px}
  .q-title{font-size:16px;line-height:1.48;margin-bottom:9px}
  .options{gap:5px}.option{gap:7px;padding:8px 9px;border-radius:9px;line-height:1.4;font-size:13px}.option input{margin-top:2px;transform:scale(1.0)}
  .blank-area{gap:7px}.blank-row{grid-template-columns:1fr;gap:3px}.blank-label{font-size:11px}.blank-input{padding:9px 10px;font-size:14px}
  .actions{gap:5px;margin-top:9px}button{padding:8px 10px;font-size:12px;border-radius:8px}
  .result{margin-top:9px;padding:9px 10px;line-height:1.48;font-size:13px}.analysis-box{margin-top:6px;padding-top:6px}
  .memo-answer,.search-answer{margin-top:9px;padding:10px;line-height:1.5;font-size:13px}.memo-answer-title,.search-answer-title{font-size:14px;margin-bottom:5px}.memo-analysis,.search-analysis{margin-top:7px;padding-top:7px}.memo-tip{font-size:11px;margin-top:6px}
  .progress{font-size:11px;margin-top:8px}
  .overview-bar{margin-bottom:8px;padding:7px 8px;font-size:11px}.overview-btn{padding:6px 8px;font-size:11px}
  .overview-modal{padding:8px}.overview-sheet{max-height:88vh;border-radius:15px;padding:12px}.overview-head h3{font-size:16px}
  .qnum-grid{grid-template-columns:repeat(6,1fr);gap:5px}.qnum-btn{padding:8px 2px;font-size:11px;border-radius:7px}
  #practiceActions,#memoActions,#examActions,#searchViewActions{
    position:sticky;
    bottom:calc(env(safe-area-inset-bottom) + 4px);
    z-index:30;
    background:rgba(255,255,255,.96);
    padding:6px 4px;
    margin-left:-3px;
    margin-right:-3px;
    border-radius:11px;
    box-shadow:0 -3px 14px rgba(15,23,42,.10);
    backdrop-filter:blur(8px);
  }
  #practiceActions button,#memoActions button,#examActions button{flex:1;min-width:0;padding-left:5px;padding-right:5px}
  .exam-grid{grid-template-columns:1fr .7fr .9fr .9fr;font-size:12px}
}
</style>
</head>
<body>
<div class="app">
<h1>配电班-初级-新员工</h1>
<div class="sub">题研 · 分享刷题版</div>

<div class="panel"><div class="info"><div class="info-title">题库已加载，可直接开始</div><div id="bankMeta" class="info-meta"></div></div></div>

<div class="panel search-panel">
  <div class="search-title">🔍 题目搜索</div>
  <div class="search-row">
    <input id="searchInput" class="search-input" type="search" placeholder="输入题干、选项或答案关键字，例如：电力设备">
    <button id="clearSearchBtn" class="search-clear">清空</button>
  </div>
  <div id="searchInfo" class="search-info">输入关键字即可搜索题干、选项和正确答案。</div>
  <div id="searchResults" class="search-results"></div>
</div>

<div class="panel">
<div class="modes">
<button class="mode-btn" data-mode="memo">📖 背题模式<span class="mode-count">直接看答案</span></button>
<button class="mode-btn active" data-mode="all">📚 刷题模式<span id="allCount" class="mode-count">0 题</span></button>
<button class="mode-btn" data-mode="wrong">❌ 错题<span id="wrongCount" class="mode-count">0 题</span></button>
<button class="mode-btn" data-mode="fav">⭐ 收藏<span id="favCount" class="mode-count">0 题</span></button>
<button class="mode-btn" data-mode="exam">📝 模拟考试<span class="mode-count">自定义组卷</span></button>
</div>
</div>

<div id="typeFilterPanel" class="panel type-filter-panel">
  <div class="type-filter-title" id="typeFilterTitle">专项训练</div>
  <div class="type-filter-tip">只显示当前题库实际存在的题型；“全部题型”始终保留。</div>
  <div id="typeFilters" class="type-filters"></div>
</div>

<div id="reviewModePanel" class="panel review-mode-panel">
  <div id="reviewModeTitle" class="review-mode-title">复习方式</div>
  <div id="reviewModeTip" class="review-mode-tip">选择重新作答，或直接查看答案与解析。</div>
  <div id="reviewModeButtons" class="review-mode-buttons"></div>
</div>

<div id="orderModePanel" class="panel order-mode-panel">
  <div class="order-mode-title">训练顺序</div>
  <div id="orderModeTip" class="order-mode-tip">顺序训练按题库原顺序；乱序训练会固定本轮随机顺序。</div>
  <div id="orderModeButtons" class="order-mode-buttons"></div>
</div>

<div id="examSetup" class="panel exam-setup">
<h2>模拟考试设置</h2>
<div class="exam-tip">每种题型可分别设置题数和每题分值，自动随机抽题且不重复。</div>
<div class="exam-grid">
<div class="head">题型</div><div class="head">可用</div><div class="head">题数</div><div class="head">每题分值</div>
<div class="type-name">单选题</div><div id="availSingle">0</div><input id="countSingle" type="number" min="0" step="1" value="0"><input id="scoreSingle" type="number" min="0" step="0.5" value="2">
<div class="type-name">多选题</div><div id="availMulti">0</div><input id="countMulti" type="number" min="0" step="1" value="0"><input id="scoreMulti" type="number" min="0" step="0.5" value="2">
<div class="type-name">判断题</div><div id="availJudge">0</div><input id="countJudge" type="number" min="0" step="1" value="0"><input id="scoreJudge" type="number" min="0" step="0.5" value="1">
<div class="type-name">填空题</div><div id="availBlank">0</div><input id="countBlank" type="number" min="0" step="1" value="0"><input id="scoreBlank" type="number" min="0" step="0.5" value="2">
</div>
<div id="examTotal" class="exam-total">总题数：0 ｜ 总分：0</div>
<div class="actions"><button id="startExamBtn" class="primary">随机生成试卷</button></div>
</div>

<div id="examSummary" class="exam-summary"></div>
<div id="emptyMode" class="empty-mode"></div>

<div id="questionCard" class="question-card">
<div class="q-head"><div id="qMeta"></div><div class="head-right"><div id="qCategory" class="category"></div><button id="starBtn" class="star" title="收藏/取消收藏">☆</button></div></div>
<div id="overviewBar" class="overview-bar">
  <span id="overviewInlineSummary">已做 0｜未做 0</span>
  <button id="openOverviewBtn" class="overview-btn">☷ 题号总览</button>
</div>
<div id="qTitle" class="q-title"></div>
<div id="answerArea"></div>

<div id="practiceActions" class="actions">
<button id="prevBtn" class="secondary">上一题</button>
<button id="submitBtn" class="primary">提交答案</button>
<button id="nextBtn" class="secondary">下一题</button>
</div>

<div id="wrongManageActions" class="actions" style="display:none;">
<button id="removeWrongDirectBtn" class="danger-light">移出错题集</button>
</div>

<div id="searchViewActions" class="actions search-view-actions">
<button id="searchPrevBtn" class="secondary">上一条结果</button>
<button id="toggleSearchAnswerBtn" class="primary">查看答案</button>
<button id="backToSearchBtn" class="secondary">返回搜索结果</button>
<button id="searchNextBtn" class="secondary">下一条结果</button>
</div>

<div id="memoActions" class="actions" style="display:none;">
<button id="memoPrevBtn" class="secondary">上一题</button>
<button id="memoNextBtn" class="secondary">下一题</button>
</div>

<div id="examActions" class="actions" style="display:none;">
<button id="examPrevBtn" class="secondary">上一题</button>
<button id="submitExamBtn" class="danger">提交试卷</button>
<button id="examNextBtn" class="secondary">下一题</button>
</div>

<div id="result" class="result"></div>
<div id="progress" class="progress"></div>
</div>
</div>

<div id="overviewModal" class="overview-modal">
  <div class="overview-sheet">
    <div class="overview-head">
      <h3>题号总览</h3>
      <button id="closeOverviewBtn" class="overview-close">关闭</button>
    </div>
    <div id="overviewModalSummary" class="overview-summary"></div>
    <div id="overviewLegend" class="overview-legend"></div>
    <div id="qnumGrid" class="qnum-grid"></div>
    <div class="overview-footer">
      <span style="font-size:12px;color:#64748b;">点击题号可直接跳转</span>
      <button id="resetProgressBtn" class="reset-progress-btn">清空刷题进度</button>
    </div>
  </div>
</div>

function qid(q){return String(q["题号"])}

function normalizeJudgeToken(v){
  const raw=String(v??"").trim();
  const s=raw.toUpperCase().replace(/\s+/g,"");

  if(["对","正确","TRUE","T","√","是","YES","Y"].includes(s))return"对";
  if(["错","错误","FALSE","F","×","X","否","NO","N"].includes(s))return"错";

  return "";
}

function extractSingleChoiceLetter(v){
  const s=String(v??"")
    .trim()
    .toUpperCase()
    .replace(/[\s\.．、:：]/g,"");

  return /^[A-F]$/.test(s)?s:"";
}

function normalizeChoiceAnswer(a,t,q=null){
  if(t==="判断"){
    // 先处理直接写“对/错、正确/错误、TRUE/FALSE”等情况。
    const direct=normalizeJudgeToken(a);
    if(direct)return direct;

    // 兼容“正确答案=A/B，但 A/B 选项文字才是 正确/错误”的题库。
    // 不假设 A 一定代表正确、B 一定代表错误，而是读取实际选项文字。
    const letter=extractSingleChoiceLetter(a);
    if(letter&&q){
      const mapped=normalizeJudgeToken(q[letter]);
      if(mapped)return mapped;
    }

    // 无法可靠映射时保留原值，让异常显式暴露，而不是擅自猜测。
    return String(a??"").trim().toUpperCase();
  }

  const s=String(a??"").trim().toUpperCase();
  return [...new Set((s.match(/[A-F]/g)||[]))].sort().join("");
}

function loadModePositions(){
  let map={};

  try{
    const raw=JSON.parse(localStorage.getItem(positionMapStorageKey())||"{}");
    if(raw&&typeof raw==="object"&&!Array.isArray(raw)){
      map=raw;
    }
  }catch{}

  let migrated=false;

  const oldRanges=[
    "all:全部","memo:全部",
    "wrong:practice","wrong:memo",
    "fav:practice","fav:memo",
    ...TYPES.map(t=>`all:${t}`),
    ...TYPES.map(t=>`memo:${t}`)
  ];

  // v1.7.1 / v1.8 没有“顺序/乱序”维度，旧位置迁移为顺序训练位置。
  oldRanges.forEach(range=>{
    if(map[range]&&!map[`${range}:sequence`]){
      map[`${range}:sequence`]=map[range];
      migrated=true;
    }
  });

  if(map["wrong"]&&!map["wrong:practice:sequence"]){
    map["wrong:practice:sequence"]=map["wrong"];
    migrated=true;
  }
  if(map["fav"]&&!map["fav:practice:sequence"]){
    map["fav:practice:sequence"]=map["fav"];
    migrated=true;
  }

  // 更旧版本使用单独 localStorage key，也迁移到顺序训练。
  oldRanges.forEach(range=>{
    const ctx=`${range}:sequence`;
    if(map[ctx]&&map[ctx].qid)return;

    try{
      let oldQid=localStorage.getItem(legacyPositionStorageKey(range))||"";

      if(!oldQid&&range==="wrong:practice"){
        oldQid=localStorage.getItem(legacyPositionStorageKey("wrong"))||"";
      }
      if(!oldQid&&range==="fav:practice"){
        oldQid=localStorage.getItem(legacyPositionStorageKey("fav"))||"";
      }

      if(oldQid){
        map[ctx]={qid:String(oldQid),index:0};
        migrated=true;
      }
    }catch{}
  });

  if(migrated){
    try{
      localStorage.setItem(positionMapStorageKey(),JSON.stringify(map));
    }catch{}
  }

  return map;
}

function rememberCurrentPosition(){
  if(!appInitialized||!activeQuestions.length)return;

  const ctx=positionContext();
  if(!ctx)return;

  const q=activeQuestions[currentIndex];
  if(!q)return;

  modePositions[ctx]={
    qid:qid(q),
    index:currentIndex
  };

  saveModePositions();
}

function restoreCurrentPosition(){
  const ctx=positionContext();

  if(!ctx||!activeQuestions.length){
    currentIndex=0;
    return;
  }

  const saved=modePositions[ctx];

  if(!saved){
    currentIndex=0;
    return;
  }

  // 优先按题号恢复，题号比列表下标更稳定。
  const byQid=activeQuestions.findIndex(q=>qid(q)===String(saved.qid));

  if(byQid>=0){
    currentIndex=byQid;
    return;
  }

  // 错题/收藏列表会动态增删。
  // 如果原来的题已经不在列表中，退回到之前相近的列表位置。
  const fallback=Number(saved.index);
  currentIndex=Number.isFinite(fallback)
    ?Math.max(0,Math.min(fallback,activeQuestions.length-1))
    :0;

  // 立即把失效题号更新为当前有效题号。
  const q=activeQuestions[currentIndex];
  if(q){
    modePositions[ctx]={
      qid:qid(q),
      index:currentIndex
    };
    saveModePositions();
  }
}

function isAnswerCorrect(q,s){
  if(q.题型==="填空"){
    const st=splitBlankAnswers(q["正确答案"]),inp=s.blanks||[];
    if(inp.length!==st.length)return false;
    return st.every((a,i)=>normalizeBlankText(a)===normalizeBlankText(inp[i]));
  }
  return selectedChoiceAnswer(q,s)===normalizeChoiceAnswer(q["正确答案"],q.题型,q);
}

function hasAnswer(q,s){
  if(q.题型==="填空"){
    const st=splitBlankAnswers(q["正确答案"]);
    if((s.blanks||[]).length<st.length)return false;
    return s.blanks.every(v=>normalizeBlankText(v)!=="");

}

function fisherYates(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function reconcileShuffleOrder(baseQuestions,ctx,force=false){
  const ids=baseQuestions.map(q=>qid(q));
  const valid=new Set(ids);

  let order=force
    ?[]
    :(Array.isArray(shuffleOrders[ctx])?shuffleOrders[ctx].map(String):[]);

  order=order.filter(id=>valid.has(id));

  const seen=new Set(order);
  const missing=ids.filter(id=>!seen.has(id));

  if(force){
    order=fisherYates(ids);
  }else if(missing.length){
    // 错题/收藏可能动态增加，新题随机追加到当前乱序轮次。
    order.push(...fisherYates(missing));
  }

  shuffleOrders[ctx]=order;
  saveShuffleOrders();
  return order;
}

function getBaseQuestionsForCurrentMode(){
  if(currentMode==="all"||currentMode==="memo"){
    const type=modeTypeFilters[currentMode]||"全部";
    return type==="全部"
      ?[...allQuestions]
      :allQuestions.filter(q=>q.题型===type);
  }

  if(currentMode==="wrong"){
    const s=loadSet("wrong");
    return allQuestions.filter(q=>s.has(qid(q)));
  }

  if(currentMode==="fav"){
    const s=loadSet("fav");
    return allQuestions.filter(q=>s.has(qid(q)));
  }

  return [...activeQuestions];
}

function applyTrainingOrder(baseQuestions,forceReshuffle=false){
  const ctx=trainingRangeContext();
  if(!ctx)return [...baseQuestions];

  if(currentOrderMode()!=="random"){
    return [...baseQuestions];
  }

  const order=reconcileShuffleOrder(baseQuestions,ctx,forceReshuffle);
  const byId=new Map(baseQuestions.map(q=>[qid(q),q]));
  return order.map(id=>byId.get(id)).filter(Boolean);
}

function normalizeSearchText(v){
  return String(v??"")
    .toLowerCase()
    .replace(/\u3000/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function answerSearchText(q){
  const parts=[String(q["正确答案"]??"")];

  if(q.题型==="单选"||q.题型==="多选"){
    const letters=normalizeChoiceAnswer(q["正确答案"],q.题型,q).split("");
    letters.forEach(letter=>{
      if(q[letter])parts.push(String(q[letter]));
    });
  }else if(q.题型==="判断"){
    const normalized=normalizeChoiceAnswer(q["正确答案"],q.题型,q);
    if(normalized)parts.push(normalized);

    const letter=extractSingleChoiceLetter(q["正确答案"]);
    if(letter&&q[letter])parts.push(String(q[letter]));
  }

  return parts.join(" ");
}

function searchableText(q){
  return normalizeSearchText([
    q["题目"],
    q["A"],q["B"],q["C"],q["D"],q["E"],q["F"],
    answerSearchText(q)
  ].filter(Boolean).join(" "));
}

function doSearch(rawQuery){
  const query=normalizeSearchText(rawQuery);
  searchQuery=query;
  searchAnswerVisible=false;

  if(!query){
    searchMatches=[];
    searchInfo.textContent="输入关键字即可搜索题干、选项和正确答案。";
    searchResults.style.display="none";
    searchResults.innerHTML="";
    return;
  }

  const keywords=query.split(" ").filter(Boolean);

  searchMatches=allQuestions.filter(q=>{
    const hay=searchableText(q);
    return keywords.every(k=>hay.includes(k));
  });

  renderSearchResults();
}

function renderSearchQuestion(q){
  answerArea.innerHTML="";

  if(q.题型!=="填空"){
    const box=document.createElement("div");
    box.className="options";

    getOptions(q).forEach(opt=>{
      const div=document.createElement("div");
      div.className="option disabled";
      div.style.cursor="default";
      div.innerHTML=q.题型==="判断"
        ?`<span><strong>${esc(opt.key)}</strong></span>`
        :`<span><strong>${esc(opt.key)}.</strong> ${esc(opt.text)}</span>`;
      box.appendChild(div);
    });

    answerArea.appendChild(box);
  }

  let correctDisplay="";
  if(q.题型==="填空"){
    const standards=splitBlankAnswers(q["正确答案"]);
    correctDisplay=standards.length===1
      ?standards[0]
      :standards.map((v,i)=>`第${i+1}空：${v}`).join("；");
  }else{
    correctDisplay=normalizeChoiceAnswer(q["正确答案"],q.题型,q);
  }

  const analysis=String(q["解析"]??"").trim();
  const box=document.createElement("div");
  box.className="search-answer"+(searchAnswerVisible?" show":"");
  box.innerHTML=`
    <div class="search-answer-title">正确答案：${esc(correctDisplay)}</div>
    <div class="search-analysis">
      <strong>解析：</strong>
      ${analysis?esc(analysis):'<span class="empty">暂无解析</span>'}
    </div>
  `;
  answerArea.appendChild(box);
}

function setActiveModeButton(m){
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
}

function hideExamPieces(){
  examSetup.style.display="none";
  examSummary.style.display="none";
}

function applyMode(m){
  rememberCurrentPosition();

  currentMode=m;
  currentIndex=0;
  searchAnswerVisible=false;
  searchResults.style.display=searchQuery?"block":"none";
  setActiveModeButton((m==="examReview"||m==="examReviewAll")?"exam":m);
  hideExamPieces();
  reviewModePanel.style.display="none";
  orderModePanel.style.display="none";

  if(m==="exam"){
    typeFilterPanel.style.display="none";
    reviewModePanel.style.display="none";
    orderModePanel.style.display="none";
    overviewBar.style.display="none";
    card.style.display="none";
    emptyMode.style.display="none";
    examSetup.style.display="block";
    prepareExamSetup();
    return;
  }

  if(m==="wrong"){
    typeFilterPanel.style.display="none";
    activeQuestions=applyTrainingOrder(getBaseQuestionsForCurrentMode(),false);
    renderReviewModePanel();
    renderOrderModePanel();
  }else if(m==="fav"){
    typeFilterPanel.style.display="none";
    activeQuestions=applyTrainingOrder(getBaseQuestionsForCurrentMode(),false);
    renderReviewModePanel();
    renderOrderModePanel();
  }else if(m==="all"||m==="memo"){
    activeQuestions=filteredStudyQuestions();
    renderTypeFilterPanel();
    renderOrderModePanel();
  }else{
    typeFilterPanel.style.display="none";
    activeQuestions=[...allQuestions];
  }

  restoreCurrentPosition();
  updateCounts();
  render();
}

function renderChoiceQuestion(q,s,locked){
  const opts=getOptions(q);
  const correct=normalizeChoiceAnswer(q["正确答案"],q.题型,q);
  const box=document.createElement("div");
  box.className="options";

  opts.forEach(opt=>{
    const lab=document.createElement("label");
    lab.className="option";

    const input=document.createElement("input");
    input.type=q.题型==="多选"?"checkbox":"radio";
    input.name="answer";
    input.value=opt.key;
    input.checked=s.selected.includes(opt.key);
    input.disabled=locked;

    const span=document.createElement("span");
    span.innerHTML=q.题型==="判断"
      ?`<strong>${esc(opt.key)}</strong>`
      :`<strong>${esc(opt.key)}.</strong> ${esc(opt.text)}`;

    if(input.checked)lab.classList.add("selected");

    if(locked&&s.submitted){
      lab.classList.add("disabled");
      if(q.题型==="多选"){
        if(correct.includes(opt.key))lab.classList.add("correct");
        if(s.selected.includes(opt.key)&&!correct.includes(opt.key))lab.classList.add("wrong");
      }else{
        if(opt.key===correct)lab.classList.add("correct");
        if(s.selected.includes(opt.key)&&opt.key!==correct)lab.classList.add("wrong");
      }
    }

    input.addEventListener("change",()=>{
      if(q.题型==="多选"){
        if(input.checked&&!s.selected.includes(opt.key))s.selected.push(opt.key);
        if(!input.checked)s.selected=s.selected.filter(v=>v!==opt.key);
      }else{
        s.selected=[opt.key];
      }
      render();
    });

    lab.appendChild(input);
    lab.appendChild(span);
    box.appendChild(lab);
  });

  answerArea.appendChild(box);
}

function renderBlankQuestion(q,s,locked){
  const st=splitBlankAnswers(q["正确答案"]);
  while(s.blanks.length<st.length)s.blanks.push("");
  if(s.blanks.length>st.length)s.blanks=s.blanks.slice(0,st.length);

  const box=document.createElement("div");
  box.className="blank-area";

  st.forEach((standard,i)=>{
    const row=document.createElement("div");
    row.className="blank-row";

    const lab=document.createElement("div");
    lab.className="blank-label";
    lab.textContent=st.length===1?"你的答案":`填空 ${i+1}`;

    const input=document.createElement("input");
    input.className="blank-input";
    input.type="text";
    input.placeholder=st.length===1?"请输入答案":`请输入第 ${i+1} 空`;
    input.value=s.blanks[i]||"";
    input.disabled=locked;

    if(locked&&s.submitted){
      input.classList.add(
        normalizeBlankText(s.blanks[i])===normalizeBlankText(standard)?"correct":"wrong"
      );
    }

    input.addEventListener("input",()=>{
      s.blanks[i]=input.value;
      if(currentMode==="exam")updateOverviewBar();
    });

    row.appendChild(lab);
    row.appendChild(input);
    box.appendChild(row);
  });

  answerArea.appendChild(box);
}

function renderMemoQuestion(q){
  answerArea.innerHTML="";

  if(q.题型!=="填空"){
    const box=document.createElement("div");
    box.className="options";

    getOptions(q).forEach(opt=>{
      const div=document.createElement("div");
      div.className="option disabled";
      div.style.cursor="default";
      div.innerHTML=q.题型==="判断"
        ?`<span><strong>${esc(opt.key)}</strong></span>`
        :`<span><strong>${esc(opt.key)}.</strong> ${esc(opt.text)}</span>`;
      box.appendChild(div);
    });

    answerArea.appendChild(box);
  }

  let correctDisplay="";
  if(q.题型==="填空"){
    const standards=splitBlankAnswers(q["正确答案"]);
    correctDisplay=standards.length===1
      ?standards[0]
      :standards.map((v,i)=>`第${i+1}空：${v}`).join("；");
  }else{
    correctDisplay=normalizeChoiceAnswer(q["正确答案"],q.题型,q);
  }

  const analysis=String(q["解析"]??"").trim();

  const memo=document.createElement("div");
  memo.className="memo-answer";
  memo.innerHTML=`
    <div class="memo-answer-title">正确答案：${esc(correctDisplay)}</div>
    <div class="memo-analysis">
      <strong>解析：</strong>
      ${analysis?esc(analysis):'<span class="empty">暂无解析</span>'}
    </div>
    <div class="memo-tip">背题模式仅用于浏览记忆，不会产生错题记录。</div>
  `;

  answerArea.appendChild(memo);
}

function canShowOverview(){
  return currentMode==="all"
    || currentMode==="wrong"
    || currentMode==="fav"
    || currentMode==="memo"
    || currentMode==="exam"
    || currentMode==="examReviewAll";
}

function overviewKind(){
  if(currentMode==="memo"||isCollectionMemoMode())return "memo";
  if(currentMode==="exam"||currentMode==="examReviewAll")return "exam";
  return "practice";
}

function practiceOverviewCounts(){
  let ok=0,bad=0,undone=0;

  activeQuestions.forEach(q=>{
    const s=storedProgressStatus(q);
    if(s==="ok")ok++;
    else if(s==="bad")bad++;
    else undone++;
  });

  return {ok,bad,done:ok+bad,undone,total:activeQuestions.length};
}

function memoOverviewCounts(){
  let visited=0;

  activeQuestions.forEach(q=>{
    if(isMemoVisited(q))visited++;
  });

  return {
    visited,
    unvisited:activeQuestions.length-visited,
    total:activeQuestions.length
  };
}

function examOverviewCounts(){
  let answered=0,unanswered=0,ok=0,bad=0;

  activeQuestions.forEach(q=>{
    const state=getExamState(q);
    const answeredThis=hasAnswer(q,state);

    if(answeredThis)answered++;
    else unanswered++;

    if(examSubmitted&&answeredThis){
      if(isAnswerCorrect(q,state))ok++;
      else bad++;
    }
  });

  return {
    answered,
    unanswered,
    ok,
    bad,
    total:activeQuestions.length
  };
}

function updateOverviewBar(){
  if(!canShowOverview()||!activeQuestions.length){
    overviewBar.style.display="none";
    return;
  }

  overviewBar.style.display="flex";

  if(currentMode==="memo"||isCollectionMemoMode()){
    const c=memoOverviewCounts();
    overviewInlineSummary.textContent=`已浏览 ${c.visited}｜未浏览 ${c.unvisited}`;
    el("openOverviewBtn").textContent="☷ 题号总览";
    return;
  }

  if(currentMode==="exam"||currentMode==="examReviewAll"){
    const c=examOverviewCounts();

    if(examSubmitted){
      overviewInlineSummary.textContent=
        `正确 ${c.ok}｜错误 ${c.bad}｜未答 ${c.unanswered}`;
    }else{
      overviewInlineSummary.textContent=
        `已答 ${c.answered}｜未答 ${c.unanswered}`;
    }

    el("openOverviewBtn").textContent="☷ 答题卡";
    return;
  }

  const c=practiceOverviewCounts();
  overviewInlineSummary.textContent=`已做 ${c.done}｜未做 ${c.undone}`;
  el("openOverviewBtn").textContent="☷ 题号总览";
}

function renderOverviewLegend(){
  if(currentMode==="memo"||isCollectionMemoMode()){
    overviewLegend.innerHTML=`
      <span><i class="legend-dot" style="background:#f8fafc"></i>未浏览</span>
      <span><i class="legend-dot" style="background:#ede9fe;border-color:#c4b5fd"></i>已浏览</span>
      <span><i class="legend-dot legend-current"></i>当前题</span>
    `;
    return;
  }

  if(currentMode==="exam"||currentMode==="examReviewAll"){
    if(examSubmitted){
      overviewLegend.innerHTML=`
        <span><i class="legend-dot legend-ok"></i>正确</span>
        <span><i class="legend-dot legend-bad"></i>错误</span>
        <span><i class="legend-dot" style="background:#fef3c7;border-color:#fcd34d"></i>未答</span>
        <span><i class="legend-dot legend-current"></i>当前题</span>
      `;
    }else{
      overviewLegend.innerHTML=`
        <span><i class="legend-dot" style="background:#f8fafc"></i>未答</span>
        <span><i class="legend-dot" style="background:#dbeafe;border-color:#93c5fd"></i>已答</span>
        <span><i class="legend-dot legend-current"></i>当前题</span>
      `;
    }
    return;
  }

  overviewLegend.innerHTML=`
    <span><i class="legend-dot legend-unanswered"></i>未做</span>
    <span><i class="legend-dot legend-ok"></i>已做正确</span>
    <span><i class="legend-dot legend-bad"></i>已做错误</span>
    <span><i class="legend-dot legend-current"></i>当前题</span>
  `;
}

function renderOverviewModal(){
  renderOverviewLegend();

  if(currentMode==="memo"||isCollectionMemoMode()){
    const c=memoOverviewCounts();
    overviewModalSummary.textContent=
      `当前背题范围共 ${c.total} 题｜已浏览 ${c.visited}｜未浏览 ${c.unvisited}`;
  }else if(currentMode==="exam"||currentMode==="examReviewAll"){
    const c=examOverviewCounts();

    overviewModalSummary.textContent=examSubmitted
      ?`本次试卷共 ${c.total} 题｜正确 ${c.ok}｜错误 ${c.bad}｜未答 ${c.unanswered}`
      :`本次试卷共 ${c.total} 题｜已答 ${c.answered}｜未答 ${c.unanswered}`;
  }else{
    const c=practiceOverviewCounts();
    overviewModalSummary.textContent=
      `当前范围共 ${c.total} 题｜已做 ${c.done}（正确 ${c.ok}，错误 ${c.bad}）｜未做 ${c.undone}`;
  }

  qnumGrid.innerHTML="";

  activeQuestions.forEach((q,index)=>{
    const btn=document.createElement("button");
    btn.className="qnum-btn";

    if(currentMode==="memo"||isCollectionMemoMode()){
      if(isMemoVisited(q))btn.classList.add("done-visited");
    }else if(currentMode==="exam"||currentMode==="examReviewAll"){
      const state=getExamState(q);
      const answered=hasAnswer(q,state);

      if(examSubmitted){
        if(!answered){
          btn.classList.add("exam-unanswered");
        }else if(isAnswerCorrect(q,state)){
          btn.classList.add("done-ok");
        }else{
          btn.classList.add("done-bad");
        }
      }else if(answered){
        btn.classList.add("done-answered");
      }
    }else{
      const status=storedProgressStatus(q);
      if(status==="ok")btn.classList.add("done-ok");
      if(status==="bad")btn.classList.add("done-bad");
    }

    if(index===currentIndex)btn.classList.add("current");

    // 模拟考试使用“试卷顺序号”，其他模式使用原题号
    const randomTraining=trainingRangeContext()&&currentOrderMode()==="random";

    btn.textContent=(currentMode==="exam"||currentMode==="examReviewAll"||randomTraining)
      ?String(index+1)
      :String(q["题号"]??(index+1));

    btn.title=(currentMode==="exam"||currentMode==="examReviewAll")
      ?`试卷第 ${index+1} 题｜原题号 ${q["题号"]}`
      :randomTraining
        ?`乱序第 ${index+1} 题｜原题号 ${q["题号"]}`
        :`第 ${index+1} / ${activeQuestions.length} 题`;

    btn.addEventListener("click",()=>{
      if(currentMode==="exam"||currentMode==="examReviewAll"){
        currentIndex=index;
      }else{
        setCurrentQuestionIndex(index);
      }

      // 交卷后从成绩页点击答题卡题号，可进入试卷复盘
      if((currentMode==="exam"||currentMode==="examReviewAll")&&examSubmitted){
        examSummary.style.display="none";
      }

      overviewModal.classList.remove("show");
      render();
      focusQuestionTop();
    });

    qnumGrid.appendChild(btn);
  });

  if(currentMode==="all"){
    resetProgressBtn.style.display="inline-block";
    resetProgressBtn.textContent="清空刷题进度";
  }else if(currentMode==="memo"||isCollectionMemoMode()){
    resetProgressBtn.style.display="inline-block";
    resetProgressBtn.textContent="清空当前背题范围浏览记录";
  }else{
    resetProgressBtn.style.display="none";
  }
}

function openOverview(){
  if(!canShowOverview()||!activeQuestions.length)return;
  renderOverviewModal();
  overviewModal.classList.add("show");
}

function closeOverview(){
  overviewModal.classList.remove("show");
}

function render(){
  if(!activeQuestions.length){
    overviewBar.style.display="none";
    card.style.display="none";
    emptyMode.style.display="block";
    emptyMode.textContent=
      currentMode==="wrong"?"目前还没有错题。":
      currentMode==="fav"?"目前还没有收藏题。":
      currentMode==="examReview"?"本次考试没有错题。":
      (currentMode==="all"||currentMode==="memo")
        ?`${typeFilterLabel()}中没有可显示的题目。`
        :"题库中没有可显示的题目。";
    return;
  }

  emptyMode.style.display="none";
  card.style.display="block";

  if(currentIndex>=activeQuestions.length)currentIndex=activeQuestions.length-1;

  const q=activeQuestions[currentIndex];
  const s=getCurrentState(q);
  const inExam=currentMode==="exam";
  const inWrongExamReview=currentMode==="examReview";
  const inFullExamReview=currentMode==="examReviewAll";
  const inReview=inWrongExamReview||inFullExamReview;
  const inMemo=currentMode==="memo";
  const inCollectionMemo=isCollectionMemoMode();
  const inSearch=currentMode==="search";

  let meta=`第 ${currentIndex+1} / ${activeQuestions.length} 题
    <span class="tag">${esc(q.题型)}</span>
    <span style="margin-left:8px;">题号 ${esc(q["题号"])}</span>`;

  if(inExam||inReview){
    meta+=`<span class="score-tag">${esc(examScoreMap.get(qid(q))??0)} 分</span>`;
  }

  qMeta.innerHTML=meta;
  qCategory.textContent=q["分类"]?String(q["分类"]):"";
  qTitle.textContent=q["题目"];

  if(inMemo||inCollectionMemo)markMemoVisited(q);
  updateOverviewBar();
  rememberCurrentPosition();

  const fav=isFav(q);
  starBtn.textContent=fav?"★":"☆";
  starBtn.classList.toggle("on",fav);
  starBtn.style.display=(inExam&&!examSubmitted)?"none":"inline-block";

  if(inSearch){
    renderSearchQuestion(q);

    practiceActions.style.display="none";
    wrongManageActions.style.display="none";
    memoActions.style.display="none";
    examActions.style.display="none";
    searchViewActions.style.display="flex";

    el("searchPrevBtn").disabled=currentIndex===0;
    el("searchNextBtn").disabled=currentIndex===activeQuestions.length-1;
    el("toggleSearchAnswerBtn").textContent=searchAnswerVisible?"隐藏答案":"查看答案";

    resultBox.className="result";
    resultBox.innerHTML="";
    progress.textContent=`搜索结果｜第 ${currentIndex+1} / ${activeQuestions.length} 题`;
    return;
  }

  searchViewActions.style.display="none";

  if(inMemo||inCollectionMemo){
    renderMemoQuestion(q);
    practiceActions.style.display="none";
    wrongManageActions.style.display=currentMode==="wrong"?"flex":"none";
    examActions.style.display="none";
    memoActions.style.display="flex";
    el("memoPrevBtn").disabled=currentIndex===0;
    el("memoNextBtn").disabled=currentIndex===activeQuestions.length-1;
    resultBox.className="result";
    resultBox.innerHTML="";

    const orderLabel=currentOrderMode()==="random"?"乱序":"顺序";
    const memoName=inMemo
      ?`背题模式 · ${typeFilterLabel()} · ${orderLabel}`
      :(currentMode==="wrong"?`背错题 · ${orderLabel}`:`背收藏 · ${orderLabel}`);

    progress.textContent=`${memoName}｜第 ${currentIndex+1} / ${activeQuestions.length} 题`;
    return;
  }

  memoActions.style.display="none";
  searchViewActions.style.display="none";
  wrongManageActions.style.display=currentMode==="wrong"?"flex":"none";
  answerArea.innerHTML="";

  const locked=inReview||(inExam&&examSubmitted)||(!inExam&&s.submitted);

  if(q.题型==="填空")renderBlankQuestion(q,s,locked);
  else renderChoiceQuestion(q,s,locked);

  if(inExam||inReview){
    practiceActions.style.display="none";
    wrongManageActions.style.display="none";
    examActions.style.display="flex";
    el("examPrevBtn").disabled=currentIndex===0;
    el("examNextBtn").disabled=currentIndex===activeQuestions.length-1;

    if(examSubmitted||inReview){
      el("submitExamBtn").textContent="返回成绩单";
      renderResult(q,s);

      if(inFullExamReview){
        const c=examOverviewCounts();
        progress.textContent=`整卷复盘｜正确 ${c.ok}｜错误 ${c.bad}｜未答 ${c.unanswered}`;
      }else if(inWrongExamReview){
        progress.textContent=`考试错题回顾｜第 ${currentIndex+1} / ${activeQuestions.length} 题`;
      }else{
        const c=examOverviewCounts();
        progress.textContent=`考试复盘｜正确 ${c.ok}｜错误 ${c.bad}｜未答 ${c.unanswered}`;
      }
    }else{
      el("submitExamBtn").textContent="提交试卷";
      resultBox.className="result";
      resultBox.innerHTML="";
      const answered=activeQuestions.filter(q0=>hasAnswer(q0,getExamState(q0))).length;
      progress.textContent=`模拟考试｜已作答 ${answered} / ${activeQuestions.length} 题｜未交卷前不显示答案`;
    }
  }else{
    practiceActions.style.display="flex";
    examActions.style.display="none";

    submitBtn.disabled=s.submitted||inReview;
    submitBtn.textContent=s.submitted?"已提交":"提交答案";
    submitBtn.style.display=inReview?"none":"inline-block";
    prevBtn.disabled=currentIndex===0;
    nextBtn.disabled=currentIndex===activeQuestions.length-1;

    renderResult(q,s);

    const orderLabel=currentOrderMode()==="random"?"乱序":"顺序";
    const name=
      currentMode==="wrong"?`刷错题 · ${orderLabel}`:
      currentMode==="fav"?`刷收藏 · ${orderLabel}`:
      `刷题模式 · ${typeFilterLabel()} · ${orderLabel}`;

    if(inReview){
      progress.textContent=`${name}｜共 ${activeQuestions.length} 道`;
    }else{
      const c=practiceOverviewCounts();
      progress.textContent=`${name}｜已记录完成 ${c.done} / ${activeQuestions.length} 题`;
    }
  }
}

function renderResult(q,s){
  resultBox.className="result";
  resultBox.innerHTML="";
  if(!s.submitted)return;

  const ok=isAnswerCorrect(q,s);
  const analysis=String(q["解析"]??"").trim();

  let user="",correct="";

  if(q.题型==="填空"){
    const st=splitBlankAnswers(q["正确答案"]);
    user=(s.blanks||[]).map((v,i)=>`第${i+1}空：${v||"未填写"}`).join("；");
    correct=st.map((v,i)=>`第${i+1}空：${v}`).join("；");
  }else{
    user=selectedChoiceAnswer(q,s)||"未作答";
    correct=normalizeChoiceAnswer(q["正确答案"],q.题型,q);
  }

  resultBox.className="result "+(ok?"ok":"bad");

  const earned=(currentMode==="examReview"||currentMode==="examReviewAll"||(currentMode==="exam"&&examSubmitted))
    ?(ok?(examScoreMap.get(qid(q))??0):0)
    :null;

  resultBox.innerHTML=`
    <div style="font-size:17px;font-weight:700;margin-bottom:6px;">${ok?"✅ 回答正确":"❌ 回答错误"}</div>
    ${earned!==null?`<div><strong>本题得分：</strong>${earned} / ${examScoreMap.get(qid(q))??0}</div>`:""}
    <div><strong>你的答案：</strong>${esc(user)}</div>
    <div><strong>正确答案：</strong>${esc(correct)}</div>
    ${!ok?'<div class="wrong-note">已加入错题集。</div>':""}
    <div class="analysis-box"><strong>解析：</strong>${analysis?esc(analysis):'<span class="empty">暂无解析</span>'}</div>
  `;
}

submitBtn.addEventListener("click",()=>{
  if(!activeQuestions.length)return;

  const q=activeQuestions[currentIndex];
  const s=getPracticeState(q);

  if(q.题型==="填空"){
    const st=splitBlankAnswers(q["正确答案"]);
    while(s.blanks.length<st.length)s.blanks.push("");
    if(s.blanks.some(v=>normalizeBlankText(v)==="")){
      alert("请先填写所有空，再提交。");
      return;
    }
  }else if(!s.selected.length){
    alert("请先选择答案，再提交。");
    return;
  }

  s.submitted=true;
  const ok=isAnswerCorrect(q,s);

  markPracticeProgress(q,ok);
  if(!ok)addWrong(q);

  updateCounts();
  render();
});

starBtn.addEventListener("click",()=>{
  if(!activeQuestions.length)return;

  const q=activeQuestions[currentIndex];
  toggleFav(q);
  updateCounts();

  currentMode==="fav"&&!isFav(q)?applyMode("fav"):render();
});

// 模拟考试
const examInputs=[
  ["单选","countSingle","scoreSingle","availSingle"],
  ["多选","countMulti","scoreMulti","availMulti"],
  ["判断","countJudge","scoreJudge","availJudge"],
  ["填空","countBlank","scoreBlank","availBlank"]
];

function typeCount(t){return allQuestions.filter(q=>q.题型===t).length}
function readNum(id){
  const v=Number(el(id).value);
  return Number.isFinite(v)&&v>=0?v:0;
}
function formatScore(n){
  const x=Number(n);
  return Number.isInteger(x)?String(x):x.toFixed(1).replace(/\.0$/,"");
}
function prepareExamSetup(){
  examInputs.forEach(([t,c,s,a])=>{
    const n=typeCount(t);
    el(a).textContent=n;
    el(c).max=n;
  });
  updateExamTotal();
}
function updateExamTotal(){
  let tq=0,ts=0;
  examInputs.forEach(([t,c,s])=>{
    const n=Math.floor(readNum(c)),p=readNum(s);
    tq+=n;ts+=n*p;
  });
  el("examTotal").textContent=`总题数：${tq} ｜ 总分：${formatScore(ts)}`;
}
examInputs.forEach(([t,c,s])=>{
  el(c).addEventListener("input",updateExamTotal);
  el(s).addEventListener("input",updateExamTotal);
});
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

el("startExamBtn").addEventListener("click",()=>{
  const specs=[];
  let totalQ=0;

  for(const[t,c,s]of examInputs){
    const count=Math.floor(readNum(c));
    const score=readNum(s);
    const available=typeCount(t);

    if(count>available){
      alert(`${t}题只有 ${available} 道可用。`);
      return;
    }

    if(count>0&&score<=0){
      alert(`${t}题每题分值必须大于 0。`);
      return;
    }

    specs.push({type:t,count,score});
    totalQ+=count;
  }

  if(totalQ<=0){
    alert("请至少设置 1 道考试题。");
    return;
  }

  examQuestions=[];
  examStates=new Map();
  examScoreMap=new Map();
  examSubmitted=false;

  for(const spec of specs){
    const pool=allQuestions.filter(q=>q.题型===spec.type);
    const picked=shuffle(pool).slice(0,spec.count);

    picked.forEach(q=>{
      examQuestions.push(q);
      examScoreMap.set(qid(q),spec.score);
      getExamState(q);
    });
  }

  examQuestions=shuffle(examQuestions);
  activeQuestions=examQuestions;
  currentMode="exam";
  currentIndex=0;

  examSetup.style.display="none";
  examSummary.style.display="none";
  setActiveModeButton("exam");
  render();
});

el("submitExamBtn").addEventListener("click",()=>{
  if(!examQuestions.length)return;

  if(examSubmitted){
    showExamSummary();
    return;
  }

  const u=examQuestions.filter(q=>!hasAnswer(q,getExamState(q))).length;
  const msg=u>0
    ?`还有 ${u} 道题未作答，确定现在交卷吗？`
    :"确定提交试卷吗？提交后不能修改答案。";

  if(!confirm(msg))return;

  examSubmitted=true;

  examQuestions.forEach(q=>{
    const s=getExamState(q);
    s.submitted=true;
    const ok=isAnswerCorrect(q,s);
    markPracticeProgress(q,ok);
    if(!ok)addWrong(q);
  });

  updateCounts();
  showExamSummary();
});

function showExamSummary(){
  let earned=0,total=0,correctN=0;
  const byType={};

  TYPES.forEach(t=>{
    byType[t]={count:0,correct:0,earned:0,total:0};
  });

  for(const q of examQuestions){
    const s=getExamState(q);
    const score=Number(examScoreMap.get(qid(q))||0);
    const ok=isAnswerCorrect(q,s);

    total+=score;
    byType[q.题型].count++;
    byType[q.题型].total+=score;

    if(ok){
      correctN++;
      earned+=score;
      byType[q.题型].correct++;
      byType[q.题型].earned+=score;
    }
  }

  const wrong=examQuestions.filter(q=>!isAnswerCorrect(q,getExamState(q)));

  card.style.display="none";
  overviewBar.style.display="none";
  emptyMode.style.display="none";
  examSetup.style.display="none";
  examSummary.style.display="block";

  const items=TYPES
    .filter(t=>byType[t].count>0)
    .map(t=>`
      <div class="summary-item">
        <strong>${esc(t)}题</strong>
        ${byType[t].correct}/${byType[t].count} 题正确<br>
        ${formatScore(byType[t].earned)}/${formatScore(byType[t].total)} 分
      </div>
    `)
    .join("");

  examSummary.innerHTML=`
    <h2>考试结果</h2>
    <div class="big-score">${formatScore(earned)} / ${formatScore(total)} 分</div>
    <div>
      正确：<strong>${correctN}</strong> 题　
      错误/未答：<strong>${examQuestions.length-correctN}</strong> 题　
      总题数：<strong>${examQuestions.length}</strong> 题
    </div>
    <div class="summary-grid">${items}</div>
    <div class="exam-note">答错或未作答题目已自动加入错题集。</div>
    <div class="actions">
      <button id="reviewFullExamBtn" class="primary">查看整张试卷</button>
      <button id="viewExamOverviewBtn" class="secondary">查看答题卡</button>
      <button id="reviewExamWrongBtn" class="secondary" ${wrong.length?"":"disabled"}>只看错题（${wrong.length}）</button>
      <button id="resetExamBtn" class="secondary">重新设置考试</button>
    </div>
  `;

  const fullReviewBtn=document.getElementById("reviewFullExamBtn");
  if(fullReviewBtn){
    fullReviewBtn.addEventListener("click",()=>{
      currentMode="examReviewAll";
      typeFilterPanel.style.display="none";
      reviewModePanel.style.display="none";
      orderModePanel.style.display="none";
      activeQuestions=examQuestions;
      currentIndex=0;
      examSummary.style.display="none";
      setActiveModeButton("exam");
      render();
      focusQuestionTop();
    });
  }

  const overviewBtn=document.getElementById("viewExamOverviewBtn");
  if(overviewBtn){
    overviewBtn.addEventListener("click",()=>{
      activeQuestions=examQuestions;
      currentMode="examReviewAll";
      openOverview();
    });
  }

  const rb=document.getElementById("reviewExamWrongBtn");
  if(rb&&wrong.length){
    rb.addEventListener("click",()=>{
      currentMode="examReview";
      typeFilterPanel.style.display="none";
      reviewModePanel.style.display="none";
      orderModePanel.style.display="none";
      activeQuestions=wrong;
      currentIndex=0;
      examSummary.style.display="none";
      setActiveModeButton("exam");
      render();
    });
  }

  document.getElementById("resetExamBtn").addEventListener("click",()=>applyMode("exam"));
}
